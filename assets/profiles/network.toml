# Network profile — filter-only whitelist for tcpdump / netstat / dig /
# wireshark output. No append_rules.
#
# Whitelist excludes (rationale per built-in):
#   - uuid: Rare in network capture output.
#   - permission: Not relevant to network analysis.
#   - email: Not relevant to network analysis.
#   - duration: Network captures use precise timestamps, not durations.
#   - filename: Not relevant.
#
# log_level + timestamp INCLUDED — routing daemon logs and `tcpdump -tttt`
# preserve them in capture-style output.

rules = [
    "timestamp",
    "log_level",
    "ipv4",
    "ipv6",
    "mac",
    "fqdn",
    "url",
]
