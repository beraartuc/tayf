# Kubernetes profile — append_rule adds pod_name shape on top of all 12
# built-ins. Activate with `tayf --profile k8s`.

[[append_rules]]
name = "pod_name"
# K8s ReplicaSet-managed pod naming: <deploy-name>-<rs-hash:10>-<pod-hash:5>.
#
# AUDIT DEVIATION (v0.5.1 spec §11.2 recommended `[a-f0-9]{10}`):
# K8s `apimachinery/pkg/util/rand` uses base32 subset alphabet:
#   bcdfghjklmnpqrstvwxz2456789  (27 chars, no vowels, no 0/1)
# Hex-only shape would miss real pods whose hash contains
# g/h/j/k/l/m/n/p/q/r/s/t/v/w/x/z — ~99% of real pods. Strict K8s
# base32 alphabet preserves the audit's suffix-anchor SPIRIT while
# restoring accuracy.
#
# Examples:
#   nginx-deployment-7c79c4bf97-9hk6r   (all-hex hash, lucky)
#   coredns-558bd4d5db-vwz2j            (mixed hex/non-hex)
#   my-app-bcdfghjklm-xyz25             (pure non-hex hash)
pattern = '\b[a-z][a-z0-9-]*-[bcdfghjklmnpqrstvwxz2456789]{10}-[bcdfghjklmnpqrstvwxz2456789]{5}\b'
# Neon (dark-tuned); on a light background override in user config.
style = { fg = "#ff7a4d" }
