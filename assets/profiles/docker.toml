# Docker profile — append_rules add container_id and image_tag shapes
# on top of all 13 built-ins. Activate with `tayf --profile docker`.

[[append_rules]]
name = "container_id"
# 12-hex shape. Collisions with git short hash, MD5 chunks, and
# UUID-internal 12-hex segments are ACCEPTED by design (v0.5.3 Q2
# brainstorm verdict: profile activation is opt-in domain context).
# To disable, add to user-config:
#   [[rules]]
#   name = "container_id"
#   enabled = false
pattern = '\b[a-f0-9]{12}\b'
style = { fg = "cyan" }

[[append_rules]]
name = "image_tag"
# Two-branch alternation:
#   1. Registry-host required: `host.tld/path:tag`
#      Examples: gcr.io/proj/img:1.21, ghcr.io/user/repo:abc123
#   2. Bare `:latest`: `name:latest` (Docker default tag sentinel)
#      Examples: nginx:latest, library/redis:latest
# Bare images with non-latest tag (e.g., `nginx:1.21`) do NOT match.
# FP guards (negative regression tests):
#   - JSON key:value (`{"foo":"bar"}`)
#   - host:port (`localhost:8080`)
#   - module:line (`src/main.rs:42` — covered by `filename` built-in)
pattern = '(?:\b[a-z0-9-]+(?:\.[a-z0-9-]+)+/[a-z0-9._/-]+:[a-z0-9._-]+\b|\b[a-z][a-z0-9_-]*(?:/[a-z0-9_-]+)*:latest\b)'
style = { fg = "magenta" }
