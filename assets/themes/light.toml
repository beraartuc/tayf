# tayf — light-background preset theme.
#
# Adjusts the 13 built-in styles for terminals with a light background,
# where the bright_* color family renders washed out and white/bright_yellow
# are effectively invisible. Most rules keep distinct (fg, attrs) tuples;
# the one intentional overlap is `ipv4` and `log_level`, both styled
# `red + bold`. They are disambiguated by context (dotted-quad number vs.
# uppercase level word) and the spec locks this trade-off.
#
# Schema: same subset of the user config as dark.toml.

[[rules]]
name = "permission"
style = { fg = "black", dim = true }

[[rules]]
name = "timestamp"
style = { fg = "black", italic = true }

[[rules]]
name = "uuid"
style = { fg = "magenta" }

[[rules]]
name = "url"
style = { fg = "blue", underline = true }

[[rules]]
name = "email"
style = { fg = "green", bold = true }

[[rules]]
name = "ipv4"
style = { fg = "red", bold = true }

[[rules]]
name = "ipv6"
style = { fg = "magenta", italic = true }

[[rules]]
name = "mac"
style = { fg = "cyan", bold = true }

[[rules]]
name = "log_level"
style = { fg = "red", bold = true }

[[rules]]
name = "filename"
style = { fg = "blue", italic = true }

[[rules]]
name = "fqdn"
style = { fg = "blue" }

[[rules]]
name = "duration"
style = { fg = "green" }
