# tayf — dark-background preset theme.
#
# Spells out the 12 built-in Neon default styles explicitly so users can copy
# this file as a starting template. Applying `--theme dark` is a no-op compared
# to running tayf with no theme: every style here matches the built-in default.
#
# Schema is a subset of the user config: only [[rules]] blocks with
# `name` and `style`. `pattern` and `enabled = false` are rejected at
# load time (themes only override colors, never patterns).

[[rules]]
name = "permission"
style = { fg = "#83838d" }          # no dim

[[rules]]
name = "timestamp"
style = { fg = "#83838d" }

[[rules]]
name = "uuid"
style = { fg = "#ff5bf0" }

[[rules]]
name = "url"
style = { fg = "#5a8bff", underline = true }

[[rules]]
name = "email"
style = { fg = "#aeff4c" }

[[rules]]
name = "ipv4"
style = { fg = "#33c7ff" }          # no bold

[[rules]]
name = "ipv6"
style = { fg = "#7b5bff" }

[[rules]]
name = "mac"
style = { fg = "#46ffdd" }

[[rules]]
name = "log_level"
style = { fg = "#ff5372", bold = true }

[[rules]]
name = "filename"
style = { fg = "#ffac3b" }

[[rules]]
name = "fqdn"
style = { fg = "#a76eff" }

[[rules]]
name = "duration"
style = { fg = "#f7d17f" }
