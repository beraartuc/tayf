[graph]
all-features = true

[licenses]
# Licenses we allow across the dependency tree. Keep this list tight: every
# entry must match a license actually present in our transitive deps. When a
# new dep brings a new license, cargo-deny will fail loudly and we can decide
# whether to allow it explicitly here.
#
# Unicode-3.0 is required by `unicode-ident` (transitive dep of `proc-macro2`,
# which is pulled in by every proc-macro crate we use: clap_derive,
# thiserror-impl, etc.). It is the modern replacement for Unicode-DFS-2016
# and is OSI-approved. Removing proc-macro2 from the tree is not realistic
# for an idiomatic Rust project.
#
# CC0-1.0 is the public-domain dedication used by `notify` 8.x (the cross-
# platform fs watcher we adopted in v0.2.1 for config hot reload). The
# Creative Commons Zero waiver is OSI-recognized as "Free / Libre" by the
# FSF and imposes no copyleft contagion on tayf. Reviewing notify's
# repository confirms the maintainer's intent: the crate is dedicated to
# the public domain.
#
# ISC is the permissive license used by the `inotify` family (`inotify` +
# `inotify-sys`), pulled in transitively by `notify` on Linux. Functionally
# equivalent to MIT — short, OSI-approved, no copyleft. Tayf's Linux build
# cannot ship without inotify support, and the inotify maintainer's choice
# of ISC is industry-standard.
#
# Zlib is a permissive license used by `foldhash` 0.2.0, pulled in
# transitively via ratatui → kasuari (the layout cache we enable with the
# `layout-cache` feature). The zlib License is OSI-approved and FSF-
# recognized as Free/Libre; it is functionally equivalent to MIT with the
# sole addition that modified source files must be marked as changed. It
# imposes no copyleft contagion on tayf.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
deny = []
skip-tree = [
    { crate = "ratatui@0.30.0", depth = 4, reason = "drags hashbrown 0.16 + signal-hook 0.3 + itertools 0.14 via crossterm/kasuari/widgets; upstream-owned, not reducible by us" },
    { crate = "criterion@0.8.2", depth = 2, reason = "dev-only; pulls itertools 0.13" },
]
skip = [
    { crate = "thiserror-impl@1.0.69", reason = "proc-macro companion to thiserror 1.0 via portable-pty->filedescriptor; we use 2.0 directly" },
    { crate = "winnow@0.7.15", reason = "toml 0.9 / toml_edit 0.25 winnow split; upstream toml-rs migration in progress" },
    { crate = "toml_datetime@0.7.5+spec-1.1.0", reason = "same toml/toml_edit split" },
]

[advisories]
# NOTE: vulnerability advisories ALWAYS error in cargo-deny >=0.16 — no longer
# configurable. The old `vulnerability`/`notice`/`severity-threshold` keys were
# removed and now error if present. Requires cargo-deny >= 0.18.2 for the
# `unmaintained`/`unsound` scope selectors below.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
