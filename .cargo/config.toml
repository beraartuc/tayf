# Cargo configuration applied to all builds in this workspace.
#
# Linux x86_64: use the mold linker for ~5-10x faster link steps.
# Requires `mold` and `clang` to be installed on the host
# (apt install mold clang).  Other targets (macOS, ARM64) use their
# default linker, which is already adequately fast.
#
# Rationale: clippy/test/build cycles spend ~30-40% of wall time
# linking with the default `cc`.  mold parallelises this and is a
# drop-in replacement.  Release profile keeps codegen-units=1 +
# thin-LTO unchanged so CI still verifies the shipped artifact.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
