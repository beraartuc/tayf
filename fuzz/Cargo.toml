[package]
name = "tayf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tayf]
path = ".."

# Own workspace root so the parent (which has NO [workspace] table) does not
# pull fuzz/ into the product dependency tree.
[workspace]

[[bin]]
name = "ansi_sm"
path = "fuzz_targets/ansi_sm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_buffer"
path = "fuzz_targets/line_buffer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline_feed"
path = "fuzz_targets/pipeline_feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex_compile"
path = "fuzz_targets/regex_compile.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
