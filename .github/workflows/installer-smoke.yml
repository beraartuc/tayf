name: installer-smoke

# Non-gating: proves the Linux musl binary is glibc-independent by installing it
# via install.sh inside clean containers AFTER a release publishes. A failure
# here pages but does NOT gate (it cannot un-publish a shipped release).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  container-smoke:
    name: install.sh in ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:latest", "debian:oldstable"]
    container: ${{ matrix.image }}
    steps:
      - name: Install prerequisites (curl/wget vary by base image)
        run: |
          set -eu
          if command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates; fi
          if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends curl ca-certificates; fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Install via install.sh + smoke
        env:
          TAYF_INSTALL_DIR: /usr/local/bin
        run: |
          set -eu
          sh install.sh
          tayf --version | grep -E '^tayf '
