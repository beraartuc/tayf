name: installer-smoke

# Non-gating: proves the Linux musl binary is glibc-independent by installing it
# via install.sh inside clean containers AFTER a release publishes. A failure
# here pages but does NOT gate (it cannot un-publish a shipped release).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  container-smoke:
    name: install.sh in ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:latest", "debian:oldstable"]
    container: ${{ matrix.image }}
    steps:
      - name: Install prerequisites (curl/ca-certs vary by base image)
        run: |
          set -eu
          if command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates; fi
          if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends curl ca-certificates; fi
      - name: Install via the published one-liner + smoke
        # Fetch the script the way users do (no checkout -> no git/Node needed in
        # the minimal container). install.sh resolves the latest release, which
        # carries the musl binaries from v0.11.0 on.
        env:
          TAYF_INSTALL_DIR: /usr/local/bin
          REPO: ${{ github.repository }}
        run: |
          set -eu
          curl -fsSL "https://raw.githubusercontent.com/${REPO}/main/install.sh" | sh
          tayf --version | grep -E '^tayf '
