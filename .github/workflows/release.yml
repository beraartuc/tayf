name: release-dryrun

# v0.9: manual dry-run only. v1.0 will add `on: push: tags: ['v*']`.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # keyless Sigstore OIDC
  attestations: write  # SLSA build provenance

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14,      target: aarch64-apple-darwin }
          - { os: macos-13,      target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/tayf"
          shasum -a 256 "$bin" > "tayf-${{ matrix.target }}.sha256"
      - name: Attest build provenance (SLSA v1.0 Build L2, keyless)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: target/${{ matrix.target }}/release/tayf
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: tayf-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tayf
            tayf-${{ matrix.target }}.sha256

  package-and-sbom:
    name: Package + SBOM (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Validate crate packaging (no publish)
        run: |
          cargo package --list
          cargo publish --dry-run --locked
      - name: Generate CycloneDX SBOM
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo cyclonedx --format json --all
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-cyclonedx
          path: "*.cdx.json"
