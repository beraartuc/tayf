name: release

# Tag push `v*`  -> LIVE: build + sign + SBOM + crates.io publish + GitHub Release.
# workflow_dispatch -> DRY-RUN: build + attest + verify + package/SBOM only,
#                      NO crates.io publish and NO GitHub Release (the publish and
#                      release jobs are gated on `github.event_name == 'push'`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default-deny; each job opts into the minimum it needs.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # keyless Sigstore OIDC (public repo -> public-good)
      attestations: write  # SLSA build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14,      target: aarch64-apple-darwin }
          # x86_64 macOS is cross-compiled on the (plentiful) arm runner to
          # avoid the capacity-constrained macos-13 (Intel) runners.
          - { os: macos-14,      target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Set up musl cross toolchain
        # Installs only the musl cross-linker (+ qemu) for the *-musl targets so
        # `cargo build --target` links statically; reuses the pinned rustc above.
        if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@3d9770ce98eb7dbcf378563182a5e8031165f75b  # v1.41.0
        with:
          target: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Assert static binary (musl)
        # A successful build does NOT prove staticness; assert it explicitly so a
        # future flag/dep change can never silently ship a glibc-linked "static".
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/tayf"
          file "$bin"
          file "$bin" | grep -q "statically linked" \
            || { echo "::error::$bin is not statically linked"; exit 1; }
          # Arch-independent confirmation (file can be fooled): a static ELF has
          # no PT_INTERP program header.
          if readelf -l "$bin" | grep -q INTERP; then
            echo "::error::$bin has a dynamic interpreter (not static)"; exit 1
          fi
          echo "OK: $bin is statically linked"
      - name: Attest build provenance (SLSA v1.0 Build L2, keyless)
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3
        with:
          subject-path: target/${{ matrix.target }}/release/tayf
      - name: Verify provenance (smoke)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "target/${{ matrix.target }}/release/tayf" --repo "$REPO"
      - name: Stage release assets (flat-named binary + checksum + bundle)
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bin="tayf-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/tayf" "$bin"
          shasum -a 256 "$bin" > "$bin.sha256"
          cp "$BUNDLE" "$bin.sigstore.json"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: tayf-${{ matrix.target }}
          path: |
            tayf-${{ matrix.target }}
            tayf-${{ matrix.target }}.sha256
            tayf-${{ matrix.target }}.sigstore.json

  package-and-sbom:
    name: Package + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Validate crate packaging (no publish)
        run: |
          cargo package --list
          cargo publish --dry-run --locked
      - name: Generate CycloneDX SBOM
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo cyclonedx --format json --all
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-cyclonedx
          path: "*.cdx.json"

  publish-crate:
    name: Publish to crates.io
    needs: [build, package-and-sbom]
    if: github.event_name == 'push'   # tag push only — never the dry-run
    runs-on: ubuntu-latest
    environment: release              # required-reviewer gate + scoped secret
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Idempotent publish (tag must match Cargo.toml version)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF_NAME#v}"
          crate_ver="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$ver" != "$crate_ver" ]; then
            echo "::error::tag version ($ver) != Cargo.toml version ($crate_ver)"
            exit 1
          fi
          # Idempotent publish: cargo exits non-zero when the version is already
          # on the index, so capture its output and treat that single outcome as
          # success. Every other failure (auth, packaging, network) propagates.
          # (A prior crates.io read-API pre-check was unreliable — the API
          # enforces a descriptive User-Agent and 403s curl's default UA.)
          set +e
          out="$(cargo publish --locked 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo "Published v${ver} to crates.io."
          elif printf '%s' "$out" | grep -q "already exists on crates.io"; then
            echo "v${ver} already on crates.io; idempotent skip."
          else
            echo "::error::cargo publish failed (exit $status)"
            exit "$status"
          fi

  github-release:
    name: Create GitHub Release
    needs: [build, publish-crate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release + upload assets
      attestations: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Download build + SBOM artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          path: dist
          merge-multiple: true
      - name: Combined SHA256SUMS + release notes
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ( cd dist && cat tayf-*.sha256 > SHA256SUMS )
          ver="${REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || printf 'Release %s\n' "$REF_NAME" > RELEASE_NOTES.md
      - name: Create or update the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" dist/* --clobber
          else
            gh release create "$REF_NAME" dist/* \
              --title "tayf $REF_NAME" --notes-file RELEASE_NOTES.md
          fi
