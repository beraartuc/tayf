name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default-deny token permissions; each job opts into the minimum it needs.
# CI runs entirely on ephemeral GitHub-hosted runners — fork PRs carry a
# read-only token and no secrets (the `pull_request` trigger, not
# `pull_request_target`), so there is no self-hosted runner to protect.
permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        timeout-minutes: 15
        env:
          # Integration tests bypass startup background-color detection: OSC 11
          # has no answer on a CI pseudo-terminal. Production behavior unchanged.
          TAYF_DISABLE_BG_DETECT: "1"
          # Serialize tests defensively: a reload-orchestrator / fs-watcher hang
          # was seen on the old self-hosted runner. It may not reproduce on
          # GitHub-hosted; drop this once a few green runs confirm it.
          RUST_TEST_THREADS: "1"
        # `cargo test` (default scope) covers lib + bins + integration + doctests.
        # Benches run in the dedicated `bench` job via `cargo bench` (the correct
        # criterion invocation; `cargo test --all-targets` triggers criterion's
        # test mode).
        run: cargo test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo install --locked cargo-audit@0.22.1 cargo-deny@0.19.8
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # 1.88
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo check --locked --all-targets

  bench:
    name: Bench (informational)
    # Push-only: benchmarks are a main-branch regression signal, not a per-PR
    # gate. GitHub-hosted runners are timing-noisy and cost minutes.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Run benches
        run: cargo bench --bench throughput
      - name: Smoke-test estimates.json shape
        shell: bash
        run: |
          set -euo pipefail
          for bench in apply_rules/ipv4-heavy apply_rules/mixed-syslog apply_rules/captures-heavy passthrough/write_all; do
            file="target/criterion/${bench}/new/estimates.json"
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
            jq -e '.mean.point_estimate' "$file" > /dev/null || {
              echo "::error::unexpected schema in $file (mean.point_estimate missing)"; exit 1
            }
          done
      # The baseline comparison is intentionally omitted after the move to
      # GitHub-hosted runners: the committed baselines (benches/baselines/) were
      # measured on the previous self-hosted machine and are not comparable to
      # GitHub-hosted timings. Re-establish a GitHub-hosted baseline from this
      # job's uploaded criterion artifacts, then restore the comparison + gate.
      - name: Upload criterion artifacts (for baseline extraction)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: criterion
          path: target/criterion/
          retention-days: 14

  fuzz-smoke:
    name: Fuzz smoke (nightly)
    # Push-only: a main-branch regression signal. The stable adversarial guard
    # (tests/adversarial.rs) runs in the `test` job on every PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # nightly
        with:
          toolchain: nightly
      # cargo-fuzz install: VERSION-pinned (@0.13.1, the latest release) but
      # intentionally NOT --locked. Supply-chain tradeoff (accepted): the tool
      # version is pinned, but its transitive deps float to the latest
      # semver-compatible — the idiomatic `cargo install` form. Rationale:
      #  - --locked forces cargo-fuzz 0.13.1's bundled lockfile, which pins
      #    rustix 0.36.5; its Linux raw backend uses reserved `rustc_attrs` and
      #    no longer compiles on current nightly.
      #  - 0.13.1 IS the latest release (can't bump to a clean lockfile).
      # cargo-fuzz is a non-shipped dev tool, installed only on the CI runner.
      - run: cargo install cargo-fuzz@0.13.1
      - name: Build + short-run each fuzz target
        run: |
          set -euo pipefail
          cd fuzz
          for t in ansi_sm line_buffer pipeline_feed regex_compile; do
            cargo fuzz build "$t"
            cargo fuzz run "$t" -- -max_total_time=60 -timeout=10
          done

  installer-lint:
    name: Installer lint + unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: shellcheck
        run: shellcheck install.sh tests/install_sh_test.sh
      - name: Detection unit test
        run: sh tests/install_sh_test.sh

  installer-e2e:
    name: Installer e2e (macOS, latest release)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Install via install.sh + smoke
        env:
          GH_TOKEN: ${{ github.token }}   # lets the best-effort attestation path run
          TAYF_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          sh install.sh
          "${TAYF_INSTALL_DIR}/tayf" --version | grep -E '^tayf '
