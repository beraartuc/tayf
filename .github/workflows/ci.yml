name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.host }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        timeout-minutes: 10
        env:
          # OSC 11 hang root cause investigation deferred (spec §4.4 D-fallback);
          # integration tests bypass bg_detect entirely. Production behavior
          # unchanged. See CHANGELOG [0.3.2] for the investigation summary.
          TAYF_DISABLE_BG_DETECT: "1"
          # reload::tests::orchestrator_* hang indefinitely on this self-hosted
          # Linux runner when threads run in parallel (local: <2s; CI: >10min
          # timeout). Likely a runner-state / fs-watcher interaction; v0.6+
          # root cause investigation deferred. For now serialize test execution.
          RUST_TEST_THREADS: "1"
        # `cargo test` (default scope) covers lib + bins + integration tests
        # + examples + doctests.  Benches run in the dedicated bench-regression
        # job below via `cargo bench`, which is the correct invocation for
        # criterion — `cargo test --all-targets` triggers criterion's test
        # mode, which hangs indefinitely on the self-hosted Linux runner
        # (likely a plotters / system-font interaction); the bench-regression
        # job still exercises full compilation + execution of every bench.
        run: cargo test

  audit:
    name: Security audit
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  bench-regression:
    name: Bench regression (${{ matrix.host }})
    runs-on: ${{ matrix.runs-on }}
    needs: test  # only run if test passes (don't bench broken code)
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # jq must be preinstalled on the self-hosted runner (apt install jq).

      - name: Run benches
        run: cargo bench --bench throughput

      - name: Smoke test estimates.json + baseline JSON shape
        shell: bash
        run: |
          set -euo pipefail
          for bench in apply_rules/ipv4-heavy apply_rules/mixed-syslog apply_rules/captures-heavy passthrough/write_all; do
            file="target/criterion/${bench}/new/estimates.json"
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
            jq -e '.mean.point_estimate' "$file" > /dev/null || {
              echo "::error::unexpected schema in $file (mean.point_estimate missing)"; exit 1
            }
          done

          baseline="benches/baselines/latest/${{ matrix.host }}.json"
          if [[ -f "$baseline" ]]; then
            for bench in apply_rules/ipv4-heavy apply_rules/mixed-syslog apply_rules/captures-heavy passthrough/write_all; do
              jq -e --arg b "$bench" '.benches[$b].mean_ns' "$baseline" > /dev/null || {
                echo "::error::baseline $baseline missing benches[\"$bench\"].mean_ns"; exit 1
              }
            done
          fi

      - name: Compare against baseline
        id: compare
        shell: bash
        env:
          LC_NUMERIC: C
          STRICT_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'bench-ci-strict') }}
        run: |
          set -euo pipefail
          baseline="benches/baselines/latest/${{ matrix.host }}.json"
          if [[ ! -f "$baseline" ]]; then
            echo "::warning::no baseline at $baseline; skipping comparison"
            exit 0
          fi

          breach_found=0
          for bench in apply_rules/ipv4-heavy apply_rules/mixed-syslog apply_rules/captures-heavy passthrough/write_all; do
            new_mean=$(jq -e '.mean.point_estimate' "target/criterion/${bench}/new/estimates.json") || {
              echo "::error::failed to read mean.point_estimate from ${bench}'s estimates.json"; exit 1
            }
            base_mean=$(jq -e --arg b "$bench" '.benches[$b].mean_ns' "$baseline") || {
              echo "::error::baseline $baseline missing benches[\"$bench\"].mean_ns"; exit 1
            }

            if [[ "$base_mean" == "0" ]]; then
              echo "::warning::baseline for $bench is placeholder (mean_ns=0); skipping comparison"
              continue
            fi

            if [[ "$bench" == "passthrough/write_all" ]]; then
              threshold_pct=30
            else
              threshold_pct=20
            fi

            read -r delta_pct breach < <(awk -v new="$new_mean" -v base="$base_mean" -v t="$threshold_pct" '
              BEGIN {
                d = (new - base) / base * 100
                printf "%.2f %d\n", d, (d > t) ? 1 : 0
              }')

            if [[ "$breach" == "1" ]]; then
              breach_found=1
              if [[ "$STRICT_MODE" == "true" ]]; then
                echo "::error::${bench} regressed +${delta_pct}% vs baseline (threshold: ${threshold_pct}%)"
              else
                echo "::warning::${bench} regressed +${delta_pct}% vs baseline (threshold: ${threshold_pct}%) — strict mode opt-in via [bench-ci-strict] label"
              fi
            fi
          done

          if [[ "$breach_found" == "1" && "$STRICT_MODE" == "true" ]]; then
            exit 1
          fi

      - name: Upload criterion artifacts (for baseline extraction)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-${{ matrix.host }}
          path: target/criterion/
          retention-days: 14

  msrv:
    name: MSRV (1.85)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  fuzz-smoke:
    name: Fuzz smoke (nightly)
    runs-on: [self-hosted, Linux, X64]
    # TODO(v0.9 A7): non-blocking until the self-hosted runner's ASan support
    # (llvm-tools + permissive kernel mmap) is verified; then drop
    # continue-on-error to make this a hard regression gate. The blocking
    # guard meanwhile is tests/adversarial.rs in the `test` job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install --locked cargo-fuzz
      - name: Build + short-run each fuzz target
        run: |
          set -euo pipefail
          cd fuzz
          for t in ansi_sm line_buffer pipeline_feed regex_compile; do
            cargo fuzz build "$t"
            cargo fuzz run "$t" -- -max_total_time=60 -timeout=10
          done
