[package]
name = "tayf"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
description = "Terminal-agnostic, PTY-based, regex-driven output colorizer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/beraartuc/tayf"
homepage = "https://github.com/beraartuc/tayf"
authors = ["Bera Artuc <bera@korp.com.tr>"]
keywords = ["terminal", "tty", "pty", "colorize", "regex"]
categories = ["command-line-utilities"]
readme = "README.md"
include = [
    "src/**/*",
    "build.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "CHANGELOG.md",
]

[[bin]]
name = "tayf"
path = "src/main.rs"

[lib]
name = "tayf"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.27", features = ["term", "signal", "user", "fs", "poll"] }
portable-pty = "0.8"
regex = "1.10"
signal-hook = "0.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
built = { version = "0.7", features = ["git2"] }

[dev-dependencies]
# reason: criterion 0.5 — dual MIT/Apache-2.0, actively maintained by
# bheisler, used only by `benches/throughput.rs` to record v0.1 baseline
# throughput numbers (spec §7). No `unsafe` is introduced in our bench
# code; criterion itself uses minimal `unsafe` (well-audited).
criterion = "0.5"
tempfile = "3.10"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
