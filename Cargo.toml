[package]
name = "tayf"
version = "0.9.1"
edition = "2021"
rust-version = "1.88"
description = "Terminal-agnostic, PTY-based, regex-driven output colorizer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/beraartuc/tayf"
homepage = "https://github.com/beraartuc/tayf"
authors = ["Bera Artuc <bera@korp.com.tr>"]
keywords = ["terminal", "tty", "pty", "colorize", "regex"]
categories = ["command-line-utilities"]
readme = "README.md"
include = [
    "src/**/*",
    "assets/themes/*.toml",
    "assets/profiles/*.toml",
    "build.rs",
    "Cargo.toml",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "CHANGELOG.md",
]

[[bin]]
name = "tayf"
path = "src/main.rs"

[lib]
name = "tayf"
path = "src/lib.rs"

[dependencies]
arc-swap = "1.9"
clap = { version = "4.6", features = ["derive"] }
# reason: memchr — dual MIT/Apache-2.0, the canonical SIMD byte-search crate
# (maintained by BurntSushi; already in our tree as a transitive dep of regex,
# so zero new audit surface). Used by the chunk-level pipeline to scan for the
# ESC delimiter and line newlines; measured +11.5% prose / +9.7% ansi on the
# pipeline_feed micro-bench vs the std `iter().position` scan.
memchr = "2.8"
nix = { version = "0.28", features = ["term", "signal", "user", "fs", "poll"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "underline-color",
    "layout-cache",
    "macros",
    "all-widgets",
] }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
thiserror = "2.0"
toml = "0.9"
toml_edit = "0.25"

[dev-dependencies]
# reason: criterion 0.5 — dual MIT/Apache-2.0, actively maintained by
# bheisler, used only by `benches/throughput.rs` to record v0.1 baseline
# throughput numbers (spec §7). No `unsafe` is introduced in our bench
# code; criterion itself uses minimal `unsafe` (well-audited).
criterion = "0.8"
tempfile = "3.27"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "e2e_overhead"
harness = false

[[bench]]
name = "pipeline_feed"
harness = false

[[bench]]
name = "redos"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
